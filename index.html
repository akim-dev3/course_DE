<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>PHP + MySQL для ДЭ 09.02.07</title>
<style>
:root{
  color-scheme: light;
  --paper:#E7E3D6;
  --paper-raised:#F4F1E7;
  --paper-deep:#DBD6C6;
  --ink:#201F1A;
  --ink-soft:#5B594E;
  --ink-faint:#8B876F;
  --line:#C9C2AC;
  --pine:#2E5C48;
  --pine-soft:#DDE6DE;
  --amber:#8A5A12;
  --amber-soft:#EFE1C7;
  --rust:#8C3B2E;
  --rust-soft:#F0DCD5;
  --mono: ui-monospace, 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace;
  --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  --topbar-h: 56px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper)}
body{
  color:var(--ink);
  font-family:var(--serif);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button, input{font-family:inherit}
a{color:var(--pine)}

/* ---------- topbar ---------- */
.topbar{
  position:fixed; top:0; left:0; right:0; height:var(--topbar-h);
  background:var(--ink); color:var(--paper);
  display:flex; align-items:center;
  padding:0 16px;
  z-index:40;
  gap:14px;
}
.topbar .burger{
  display:none;
  background:none; border:1px solid rgba(255,255,255,.3); border-radius:4px;
  color:var(--paper); width:34px; height:34px;
  font-family:var(--mono); font-size:16px;
  cursor:pointer;
  flex:0 0 auto;
}
.topbar .brand{
  font-family:var(--mono); font-weight:700; font-size:14px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.topbar .brand small{display:block; font-weight:400; font-size:11px; color:#B9B6A6; margin-top:1px}
.topbar nav{
  margin-left:auto;
  display:flex; gap:4px;
}
.topbar nav button{
  background:none; border:1px solid transparent; border-radius:4px;
  color:#C9C6B6; font-family:var(--mono); font-size:13px;
  padding:7px 12px; cursor:pointer;
}
.topbar nav button.active{background:var(--paper); color:var(--ink)}
.topbar nav button:not(.active):hover{border-color:rgba(255,255,255,.3); color:var(--paper)}

/* ---------- layout shell ---------- */
.shell{
  display:flex;
  padding-top:var(--topbar-h);
  min-height:100vh;
}
.backdrop{
  display:none;
  position:fixed; inset:0; top:var(--topbar-h);
  background:rgba(0,0,0,.35);
  z-index:20;
}
.backdrop.show{display:block}

/* ---------- sidebar (shared by lessons & materials) ---------- */
.rail{
  width:300px; flex:0 0 auto;
  background:var(--paper);
  border-right:1px solid var(--line);
  position:fixed; top:var(--topbar-h); bottom:0; left:0;
  overflow-y:auto;
  z-index:30;
  transition:transform .25s ease;
}
.rail-search{
  padding:16px 18px 10px;
  position:sticky; top:0; background:var(--paper); z-index:1;
}
.rail-search input{
  width:100%; padding:8px 10px;
  border:1px solid var(--line); border-radius:4px;
  background:var(--paper-raised);
  font-family:var(--mono); font-size:13px; color:var(--ink);
}
.rail-search input::placeholder{color:var(--ink-faint)}
.rail-progress{
  padding:2px 18px 10px;
  font-family:var(--mono); font-size:11.5px; color:var(--ink-soft);
}
.rail-progress .bar{
  height:3px; background:var(--line); border-radius:2px; margin-top:6px; overflow:hidden;
}
.rail-progress .bar i{display:block; height:100%; background:var(--pine)}
.block-group{margin-top:4px}
.block-title{
  font-family:var(--mono); font-size:11.5px; color:var(--ink-faint);
  padding:12px 18px 4px;
}
.lesson-link{
  display:flex; align-items:flex-start; gap:9px;
  width:100%; text-align:left;
  background:none; border:none; cursor:pointer;
  font-family:var(--mono); font-size:13px; color:var(--ink);
  padding:8px 18px;
  line-height:1.4;
}
.lesson-link .dot{
  flex:0 0 auto; margin-top:5px;
  width:6px;height:6px; border-radius:50%;
  border:1px solid var(--ink-faint); background:transparent;
}
.lesson-link.visited .dot{background:var(--ink-faint); border-color:var(--ink-faint)}
.lesson-link .num{color:var(--ink-faint); flex:0 0 auto}
.lesson-link .label{flex:1 1 auto; word-break:break-word}
.lesson-link:hover{background:var(--paper-raised)}
.lesson-link.active{background:var(--pine-soft)}
.lesson-link.active .dot{background:var(--pine); border-color:var(--pine)}
.lesson-link.hidden{display:none}
.rail-empty{padding:14px 18px; font-family:var(--mono); font-size:12.5px; color:var(--ink-faint)}

/* ---------- main content ---------- */
.main{
  flex:1 1 auto;
  margin-left:300px;
  min-width:0;
  padding:44px 40px 120px;
}
.sheet{max-width:700px}
.crumb{font-family:var(--mono); font-size:12px; color:var(--ink-soft); margin-bottom:10px}
.sheet h2{
  font-family:var(--mono); font-size:25px; margin:0 0 26px; line-height:1.32;
  border-bottom:1px solid var(--line); padding-bottom:16px;
}
.theory p{margin:0 0 15px; font-size:16.5px}
.theory{margin-bottom:24px}
.theory-note p{margin:0 0 24px; font-size:14px; color:var(--ink-soft); font-family:var(--mono); line-height:1.5}
.intro-note{
  font-family:var(--mono); font-size:12px; color:var(--ink-soft);
  border:1px solid var(--line); border-radius:4px; padding:12px 16px;
  margin-bottom:24px; background:var(--paper-raised);
}

/* ---------- code blocks + syntax highlight ---------- */
.codebox{
  background:#22211C; color:#E9E5D6;
  border-radius:5px; padding:16px 18px; margin:0 0 26px;
  overflow-x:auto;
}
.codebox pre{margin:0; font-family:var(--mono); font-size:13px; line-height:1.6; white-space:pre}
.tok-kw{color:#7FB3D5; font-weight:700}
.tok-str{color:#B7CE8C}
.tok-var{color:#E0A55C}
.tok-com{color:#8A8676; font-style:italic}
.tok-num{color:#C98BDB}
.tok-fn{color:#E9C879}
.tok-op{color:#D2836B}

/* ---------- tasks ---------- */
.tasks h3{font-family:var(--mono); font-size:14px; margin:0 0 12px; color:var(--ink-soft)}
.task{
  padding:13px 16px; border:1px solid var(--line); border-radius:5px;
  margin-bottom:10px; background:var(--paper-raised);
}
.task .lvl{font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-bottom:5px}
.task.lvl2{border-left:3px solid var(--pine)}
.task.lvl3{border-left:3px solid var(--amber); background:var(--amber-soft)}
.task.lvl3 .lvl{color:var(--amber)}
.task p{margin:0; font-size:15px}

.navpair{
  display:flex; justify-content:space-between; margin-top:36px; padding-top:18px;
  border-top:1px solid var(--line); font-family:var(--mono); font-size:13px;
}
.navpair button{
  background:none; border:1px solid var(--line); border-radius:4px;
  padding:8px 14px; font-family:var(--mono); font-size:13px; cursor:pointer; color:var(--ink);
}
.navpair button:hover:not(:disabled){background:var(--paper-raised)}
.navpair button:disabled{opacity:.3; cursor:default}

/* ---------- materials view ---------- */
.mat-card{
  border:1px solid var(--line); border-radius:6px; background:var(--paper-raised);
  padding:18px 20px; margin-bottom:18px;
}
.mat-card h4{font-family:var(--mono); font-size:14px; margin:0 0 4px}
.mat-card .desc{font-size:14.5px; color:var(--ink-soft); margin:0 0 12px}
.guide-note{
  font-family:var(--mono); font-size:13px; color:var(--ink-soft);
  margin:-18px 0 22px; padding:10px 14px;
  border-left:3px solid var(--pine); background:var(--paper-raised); border-radius:0 4px 4px 0;
  line-height:1.55;
}
.guide-p{font-size:16px; line-height:1.65; margin:0 0 18px}
.guide-h3{font-family:var(--mono); font-size:15.5px; margin:26px 0 12px; color:var(--ink)}
.guide-list{margin:0 0 18px; padding-left:22px}
.guide-list li{font-size:15.5px; line-height:1.6; margin-bottom:10px}
.mat-search{margin-bottom:20px}
.mat-search input{
  width:100%; max-width:320px; padding:8px 12px; font-family:var(--mono); font-size:13px;
  border:1px solid var(--line); border-radius:5px; background:var(--paper-raised);
}
.ref-card{
  border:1px solid var(--line); border-radius:6px; padding:16px 18px; margin-bottom:14px;
  background:var(--paper-raised);
}
.ref-term{font-family:var(--mono); font-size:15px; font-weight:700; margin-bottom:5px}
.ref-desc{font-size:14.5px; color:var(--ink-soft); margin-bottom:10px}
.ref-example{margin:0}
table.refs{width:100%; border-collapse:collapse; font-size:14px}
table.refs th, table.refs td{
  text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top;
}
table.refs th{font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); font-weight:400}
table.refs code{font-family:var(--mono); background:var(--paper-deep); padding:1px 5px; border-radius:3px; font-size:13px}
.err-item{border-left:3px solid var(--rust); background:var(--rust-soft); border-radius:0 5px 5px 0; padding:12px 16px; margin-bottom:12px}
.err-item .msg{font-family:var(--mono); font-size:12.5px; color:var(--rust); margin-bottom:6px}
.err-item .fix{font-size:14.5px; margin:0}
.checklist{list-style:none; margin:0; padding:0}
.checklist li{
  display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:15px;
}
.checklist li::before{content:'☐'; color:var(--ink-faint); flex:0 0 auto}

.task-foot{margin-top:8px}
.solution-toggle{
  background:none; border:1px solid var(--line); border-radius:4px;
  font-family:var(--mono); font-size:11.5px; color:var(--ink-soft);
  padding:4px 9px; cursor:pointer;
}
.solution-toggle:hover{background:var(--paper-deep)}
.solution-box{
  margin-top:10px; background:#22211C; color:#E9E5D6;
  border-radius:4px; padding:12px 14px; font-family:var(--mono); font-size:12.5px;
  line-height:1.55; white-space:pre-wrap; display:none;
}
.solution-box.show{display:block}

.status-row{
  display:flex; gap:10px; margin-top:32px; padding-top:18px; border-top:1px solid var(--line);
}
.status-btn{
  flex:1 1 0; font-family:var(--mono); font-size:13px; padding:10px 12px;
  border-radius:5px; border:1px solid var(--line); background:var(--paper-raised); cursor:pointer;
  color:var(--ink);
}
.status-btn.understood.active{background:var(--pine); color:#fff; border-color:var(--pine)}
.status-btn.review.active{background:var(--amber); color:#fff; border-color:var(--amber)}

.lesson-link .dot.understood{background:var(--pine); border-color:var(--pine)}
.lesson-link .dot.review{background:var(--amber); border-color:var(--amber)}

.rail-filter{
  display:flex; align-items:center; gap:6px;
  padding:0 18px 10px; font-family:var(--mono); font-size:11.5px; color:var(--ink-soft);
  cursor:pointer;
}
.rail-filter input{margin:0}

/* ---------- quiz ---------- */
.quiz-setup{border:1px solid var(--line); border-radius:6px; padding:20px; background:var(--paper-raised)}
.quiz-setup select{
  font-family:var(--mono); font-size:13px; padding:7px 9px; border:1px solid var(--line);
  border-radius:4px; background:var(--paper); margin:10px 0 16px; width:100%;
}
.quiz-start-btn, .quiz-next-btn{
  background:var(--pine); color:#fff; border:none; border-radius:5px;
  font-family:var(--mono); font-size:14px; padding:10px 18px; cursor:pointer;
}
.quiz-card{
  border:1px solid var(--line); border-radius:8px; padding:32px 26px;
  background:var(--paper-raised);
  display:flex; flex-direction:column; gap:20px;
}
.quiz-question{font-size:18px; font-weight:700; text-align:center; line-height:1.4}
.quiz-options{display:flex; flex-direction:column; gap:10px}
.quiz-option{
  display:block; width:100%; text-align:left;
  padding:13px 16px; border:1px solid var(--line); border-radius:6px;
  background:var(--paper); cursor:pointer; font-size:14.5px;
}
.quiz-option code{font-family:var(--mono); font-size:14px}
.quiz-option:hover:not(:disabled){border-color:var(--pine); background:var(--pine-soft)}
.quiz-option:disabled{cursor:default}
.quiz-option.correct{border-color:var(--pine); background:var(--pine-soft); font-weight:700}
.quiz-option.incorrect{border-color:var(--rust); background:var(--rust-soft)}
.quiz-actions{min-height:44px; display:flex; align-items:center; justify-content:center}
.quiz-progress{font-family:var(--mono); font-size:12px; color:var(--ink-soft); margin-bottom:14px}
.quiz-summary{text-align:center; padding:30px 20px}
.quiz-summary .score{font-family:var(--mono); font-size:32px; margin:10px 0}

@media (max-width: 860px){
  .topbar .burger{display:flex; align-items:center; justify-content:center}
  .topbar .brand{display:none}
  .topbar nav{overflow-x:auto; -webkit-overflow-scrolling:touch; gap:2px}
  .topbar nav button{padding:7px 8px; font-size:12px; white-space:nowrap}
  .rail{transform:translateX(-100%); width:86vw; max-width:340px; box-shadow:2px 0 14px rgba(0,0,0,.2)}
  .rail.open{transform:translateX(0)}
  .main{margin-left:0; padding:28px 20px 90px}
  .sheet h2{font-size:21px}
}
</style>
</head>
<body>
<div class="topbar">
  <button class="burger" id="burgerBtn" aria-label="Меню">≡</button>
  <div class="brand">PHP + MySQL для ДЭ<small>09.02.07 — Разработчик веб и мультимедийных приложений</small></div>
  <nav>
    <button data-view="lessons" class="active">Уроки</button>
    <button data-view="exam">Демоэкзамен</button>
    <button data-view="materials">Материалы</button>
    <button data-view="quiz">Тренажёр</button>
  </nav>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main class="main"><div class="sheet" id="content"></div></main>
</div>
<script>
const COURSE = [
  {
    "block": 0,
    "title": "Среда",
    "lessons": [
      {
        "id": "0.1",
        "title": "Установка XAMPP",
        "theory": [
          "XAMPP — программа, которая запускает PHP на твоём компьютере. Файлы кладутся в её папку htdocs, оттуда открываются по адресу в браузере."
        ],
        "code": "htdocs/hello/index.php  →  http://localhost/hello/",
        "tasks": [
          {
            "lvl": 1,
            "text": "Скачай и установи XAMPP (apachefriends.org). В Control Panel запусти Apache и MySQL — оба должны стать зелёными / Running.",
            "solution": "apachefriends.org → скачать → установить → открыть XAMPP Control Panel → Start у Apache и MySQL."
          },
          {
            "lvl": 2,
            "text": "Найди папку htdocs (внутри папки установки XAMPP). Создай в ней папку hello, внутри — index.php с echo \"Привет\".",
            "solution": "htdocs/hello/index.php:\n<?php\necho \"Привет\";"
          },
          {
            "lvl": 3,
            "text": "Открой в браузере http://localhost/hello/. Должен показаться именно текст \"Привет\", а не код и не список файлов.",
            "solution": "Виден код как текст → Apache не запущен.\nОшибка 404 → папка/файл названы иначе, чем в адресе.\nБелый экран → смотри xampp/apache/logs/error.log."
          }
        ]
      },
      {
        "id": "0.2",
        "title": "Браузер, сервер, PHP и MySQL",
        "theory": [
          "PHP выполняется только на сервере — открывай через http://, не двойным кликом по файлу."
        ],
        "code": "<?php\necho \"Привет, мир\";\n?>",
        "tasks": [
          {
            "lvl": 1,
            "text": "Напиши hello.php: через переменную $name выведи \"Привет, <имя>\".",
            "solution": "$name = \"Илья\";\necho \"Привет, \" . $name;"
          },
          {
            "lvl": 2,
            "text": "Напиши строку, которая через extension_loaded('pdo_mysql') и var_dump проверяет, включён ли модуль.",
            "solution": "var_dump(extension_loaded('pdo_mysql'));"
          },
          {
            "lvl": 3,
            "text": "Напиши строку, которая через phpversion() выводит текущую версию PHP.",
            "solution": "echo \"Версия PHP: \" . phpversion();"
          }
        ]
      },
      {
        "id": "0.3",
        "title": "Первый рабочий проект руками",
        "theory": [
          "require 'file.php' подключает файл на этом месте; путь без / в начале — относительный, работает в любой папке."
        ],
        "code": "index.php:\n<a href=\"about.php\">О проекте</a>\n\nabout.php:\n<?php require 'data.php'; ?>\n<p>Автор: <?= $author ?></p>\n\ndata.php:\n<?php $author = 'Илья'; ?>",
        "tasks": [
          {
            "lvl": 1,
            "text": "Сделай index.php и about.php с рабочей ссылкой между ними.",
            "solution": "index.php:\n<a href=\"about.php\">О проекте</a>\n\nabout.php:\n<p>Здесь текст о проекте</p>"
          },
          {
            "lvl": 2,
            "text": "Вынеси одну переменную в третий файл, подключи через require и выведи её на about.php.",
            "solution": "data.php:\n<?php $author = 'Илья'; ?>\n\nabout.php:\n<?php require 'data.php'; ?>\n<p>Автор: <?= $author ?></p>"
          },
          {
            "lvl": 3,
            "text": "Подключи через require второй файл footer.php, который выводит текущий год через date('Y').",
            "solution": "footer.php:\n<?php echo date('Y'); ?>\n\nindex.php:\n<?php require 'footer.php'; ?>"
          }
        ]
      }
    ]
  },
  {
    "block": 1,
    "title": "Синтаксис PHP",
    "lessons": [
      {
        "id": "1.1",
        "title": "Переменные и вывод",
        "theory": [
          "$переменная — именованная ячейка для значения. echo выводит текст на страницу. Склейка строк — через точку, не плюс."
        ],
        "code": "<?php\n$name = \"Илья\";      // переменная: хранит значение \"Илья\"\n$age = 19;           // переменная может хранить и число\n\necho \"Привет, \" . $name . \"! Тебе \" . $age . \" лет.\";\necho \"Привет, {$name}! Тебе {$age} лет.\";  // то же самое, короче",
        "tasks": [
          {
            "lvl": 1,
            "text": "Выведи переменные $login и $email одной строкой двумя способами: через точку и через {}.",
            "solution": "echo $login . \" \" . $email;\necho \"{$login} {$email}\";"
          },
          {
            "lvl": 2,
            "text": "Создай $user = ['login' => 'test123', 'age' => 20]; выведи оба значения через двойные кавычки с {}.",
            "solution": "$user = ['login' => 'test123', 'age' => 20];\necho \"Логин: {$user['login']}, возраст: {$user['age']}\";"
          },
          {
            "lvl": 3,
            "text": "Пройдись foreach по $courses = ['Алгоритмизация', 'Веб-дизайн', 'БД'] и выведи нумерованный список (1. ..., 2. ..., 3. ...).",
            "solution": "$courses = ['Алгоритмизация', 'Веб-дизайн', 'БД'];\n$i = 1;\nforeach ($courses as $c) {\n    echo $i . '. ' . $c . \"\\n\";\n    $i++;\n}"
          }
        ]
      },
      {
        "id": "1.2",
        "title": "Массивы",
        "theory": [
          "Массив — список значений в одной переменной. Индексный: $a=[1,2,3] — по номеру. Ассоциативный: $u=['ключ'=>значение] — по имени."
        ],
        "code": "<?php\n$colors = ['красный', 'зелёный', 'синий'];  // индексный массив\necho $colors[0];                             // \"красный\" — нумерация с 0\n\n$user = ['login' => 'test123', 'email' => 'test@mail.ru'];  // ассоциативный\nforeach ($user as $key => $value) {          // проходим по каждой паре\n    echo \"$key: $value\\n\";\n}",
        "tasks": [
          {
            "lvl": 1,
            "text": "Создай ассоциативный массив $request с ключами course, date, status. Выведи все три значения.",
            "solution": "$request = ['course' => 'Веб-дизайн', 'date' => '01.10.2026', 'status' => 'Новая'];\necho $request['course'] . ' ' . $request['date'] . ' ' . $request['status'];"
          },
          {

{
  id: 'oop',
  title: 'ООП — классы для бэкенда',
  blocks: [
    { t: 'note', v: 'ТЗ требует полный стек, включая ООП. Минимально достаточно двух классов — User и Request, оба работают с $pdo напрямую.' },
    { t: 'h3', v: 'classes/User.php' },
    { t: 'code', v: `<?php

class User
{
    private $pdo;

    public function __construct($pdo)
    {
        $this->pdo = $pdo;
    }

    public function isLoginTaken($login)
    {
        $st = $this->pdo->prepare('SELECT id FROM users WHERE login = ?');
        $st->execute([$login]);
        return (bool) $st->fetch();
    }

    public function register($login, $password, $fio, $phone, $email)
    {
        $hash = password_hash($password, PASSWORD_DEFAULT);
        $st = $this->pdo->prepare('INSERT INTO users (login, password, fio, phone, email) VALUES (?, ?, ?, ?, ?)');
        $st->execute([$login, $hash, $fio, $phone, $email]);
    }

    public function attemptLogin($login, $password)
    {
        $st = $this->pdo->prepare('SELECT * FROM users WHERE login = ?');
        $st->execute([$login]);
        $user = $st->fetch();
        if ($user && password_verify($password, $user['password'])) {
            return $user;
        }
        return null;
    }
}` },
    { t: 'h3', v: 'classes/Request.php' },
    { t: 'code', v: `<?php

class Request
{
    private $pdo;
    public static $statuses = ['Новая', 'Идёт обучение', 'Обучение завершено'];

    public function __construct($pdo)
    {
        $this->pdo = $pdo;
    }

    public function create($userId, $course, $startDate, $payment)
    {
        $st = $this->pdo->prepare('INSERT INTO requests (user_id, course, start_date, payment, status) VALUES (?, ?, ?, ?, ?)');
        $st->execute([$userId, $course, $startDate, $payment, 'Новая']);
    }

    public function getByUser($userId)
    {
        $st = $this->pdo->prepare('SELECT * FROM requests WHERE user_id = ? ORDER BY id DESC');
        $st->execute([$userId]);
        return $st->fetchAll();
    }

    public function addReview($id, $userId, $text)
    {
        $st = $this->pdo->prepare("UPDATE requests SET review = ? WHERE id = ? AND user_id = ? AND status = 'Обучение завершено'");
        $st->execute([$text, $id, $userId]);
    }

    public function changeStatus($id, $status)
    {
        if (in_array($status, self::$statuses, true)) {
            $st = $this->pdo->prepare('UPDATE requests SET status = ? WHERE id = ?');
            $st->execute([$status, $id]);
        }
    }

    public function getForAdmin($filterStatus, $limit, $offset)
    {
        $sql = 'SELECT r.*, u.fio, u.login FROM requests r JOIN users u ON u.id = r.user_id';
        $params = [];
        if ($filterStatus != '') {
            $sql .= ' WHERE r.status = ?';
            $params[] = $filterStatus;
        }
        $sql .= ' ORDER BY r.id DESC LIMIT ' . (int)$limit . ' OFFSET ' . (int)$offset;
        $st = $this->pdo->prepare($sql);
        $st->execute($params);
        return $st->fetchAll();
    }

    public function countForAdmin($filterStatus)
    {
        $sql = 'SELECT COUNT(*) FROM requests';
        $params = [];
        if ($filterStatus != '') {
            $sql .= ' WHERE status = ?';
            $params[] = $filterStatus;
        }
        $st = $this->pdo->prepare($sql);
        $st->execute($params);
        return (int) $st->fetchColumn();
    }
}` },

    { t: 'h3', v: 'Шаг 3 — classes/User.php' },
    { t: 'code', v: `<?php

class User
{
    private $pdo;

    public function __construct($pdo)
    {
        $this->pdo = $pdo;
    }

    public function isLoginTaken($login)
    {
        $st = $this->pdo->prepare('SELECT id FROM users WHERE login = ?');
        $st->execute([$login]);
        return (bool) $st->fetch();
    }

    public function register($login, $password, $fio, $phone, $email)
    {
        $hash = password_hash($password, PASSWORD_DEFAULT);
        $st = $this->pdo->prepare('INSERT INTO users (login, password, fio, phone, email) VALUES (?, ?, ?, ?, ?)');
        $st->execute([$login, $hash, $fio, $phone, $email]);
    }

    public function attemptLogin($login, $password)
    {
        $st = $this->pdo->prepare('SELECT * FROM users WHERE login = ?');
        $st->execute([$login]);
        $user = $st->fetch();
        if ($user && password_verify($password, $user['password'])) {
            return $user;
        }
        return null;
    }
}` },

    { t: 'h3', v: 'Шаг 4 — classes/Request.php' },
    { t: 'code', v: `<?php

class Request
{
    private $pdo;

    public static $statuses = ['Новая', 'Идёт обучение', 'Обучение завершено'];

    public function __construct($pdo)
    {
        $this->pdo = $pdo;
    }

    public function create($userId, $course, $startDate, $payment)
    {
        $st = $this->pdo->prepare('INSERT INTO requests (user_id, course, start_date, payment, status) VALUES (?, ?, ?, ?, ?)');
        $st->execute([$userId, $course, $startDate, $payment, 'Новая']);
    }

    public function getByUser($userId)
    {
        $st = $this->pdo->prepare('SELECT * FROM requests WHERE user_id = ? ORDER BY id DESC');
        $st->execute([$userId]);
        return $st->fetchAll();
    }

    // отзыв можно оставить только по завершённому обучению - проверка прямо в запросе
    public function addReview($id, $userId, $text)
    {
        $st = $this->pdo->prepare("UPDATE requests SET review = ? WHERE id = ? AND user_id = ? AND status = 'Обучение завершено'");
        $st->execute([$text, $id, $userId]);
    }

    public function changeStatus($id, $status)
    {
        if (in_array($status, self::$statuses, true)) {
            $st = $this->pdo->prepare('UPDATE requests SET status = ? WHERE id = ?');
            $st->execute([$status, $id]);
        }
    }

    public function getForAdmin($filterStatus, $limit, $offset)
    {
        $sql = 'SELECT r.*, u.fio, u.login FROM requests r JOIN users u ON u.id = r.user_id';
        $params = [];
        if ($filterStatus != '') {
            $sql .= ' WHERE r.status = ?';
            $params[] = $filterStatus;
        }
        $sql .= ' ORDER BY r.id DESC LIMIT ' . (int)$limit . ' OFFSET ' . (int)$offset;

        $st = $this->pdo->prepare($sql);
        $st->execute($params);
        return $st->fetchAll();
    }

    public function countForAdmin($filterStatus)
    {
        $sql = 'SELECT COUNT(*) FROM requests';
        $params = [];
        if ($filterStatus != '') {
            $sql .= ' WHERE status = ?';
            $params[] = $filterStatus;
        }
        $st = $this->pdo->prepare($sql);
        $st->execute($params);
        return (int) $st->fetchColumn();
    }
}` },

    { t: 'h3', v: 'Шаг 5 — includes/validators.php' },
    { t: 'code', v: `<?php

function validLogin($v)
{
    return preg_match('/^[a-zA-Z0-9]{6,}$/', $v);
}

function validPassword($v)
{
    return mb_strlen($v) >= 8;
}

function validFio($v)
{
    // ФИО - кириллица и пробелы
    return preg_match('/^[А-Яа-яЁё\\s]{3,}$/u', $v);
}

function validPhone($v)
{
    return preg_match('/^8\\(\\d{3}\\)\\d{3}-\\d{2}-\\d{2}$/', $v);
}

function validEmail($v)
{
    return (bool) filter_var($v, FILTER_VALIDATE_EMAIL);
}

// дата в формате ДД.ММ.ГГГГ + проверка что реально существует
function validDate($v)
{
    if (!preg_match('/^(\\d{2})\\.(\\d{2})\\.(\\d{4})$/', $v, $m)) {
        return false;
    }
    return checkdate((int)$m[2], (int)$m[1], (int)$m[3]);
}

function dateToSql($v)
{
    $p = explode('.', $v);
    return $p[2] . '-' . $p[1] . '-' . $p[0];
}` },
    { t: 'note', v: 'mb_strlen требует расширение mbstring — включено по умолчанию на XAMPP/OpenServer.' },

    { t: 'note', v: 'Это буквально все файлы проекта. Коммит — хотя бы в начале и в конце каждого модуля (см. страницу «Git на экзамене»).' }

const FLAT = [];
COURSE.forEach(b => b.lessons.forEach(l => FLAT.push({block:b, lesson:l})));

const visited = new Set();
const lessonState = {};
let currentIndex = 0;
let currentView = 'lessons';
let currentMatIndex = 0;
let currentExamIndex = 0;
let searchQuery = '';
let onlyReview = false;

function esc(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

const PHP_KEYWORDS = ['echo','if','else','elseif','foreach','as','while','for','function','return','require','include','true','false','null','isset','empty','new','use','try','catch','class','public','private','static'];
const SQL_KEYWORDS = ['SELECT','FROM','WHERE','ORDER','BY','LIMIT','OFFSET','INSERT','INTO','VALUES','UPDATE','SET','DELETE','JOIN','ON','CREATE','TABLE','PRIMARY','KEY','FOREIGN','REFERENCES','AUTO_INCREMENT','NOT','NULL','UNIQUE','AND','OR','DESC','ASC'];

function highlight(code){
  const lines = code.split('\n');
  return lines.map(line => highlightLine(line)).join('\n');
}

function highlightLine(line){
  let out = '';
  let i = 0;
  const n = line.length;
  while (i < n){
    const ch = line[i];
    if ((ch === '/' && line[i+1] === '/') || (ch === '-' && line[i+1] === '-') || (ch === '#')){
      out += '<span class="tok-com">' + esc(line.slice(i)) + '</span>';
      break;
    }
    if (ch === '"' || ch === "'"){
      let j = i + 1;
      while (j < n && line[j] !== ch) j++;
      out += '<span class="tok-str">' + esc(line.slice(i, j+1)) + '</span>';
      i = j + 1;
      continue;
    }
    if (ch === '$'){
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_\[\]'"]/.test(line[j])) j++;
      out += '<span class="tok-var">' + esc(line.slice(i, j)) + '</span>';
      i = j;
      continue;
    }
    if (/[A-Za-z_]/.test(ch)){
      let j = i;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const word = line.slice(i, j);
      const upper = word.toUpperCase();
      if (PHP_KEYWORDS.includes(word) || SQL_KEYWORDS.includes(upper)){
        out += '<span class="tok-kw">' + esc(word) + '</span>';
      } else if (line[j] === '('){
        out += '<span class="tok-fn">' + esc(word) + '</span>';
      } else {
        out += esc(word);
      }
      i = j;
      continue;
    }
    if (/[0-9]/.test(ch)){
      let j = i;
      while (j < n && /[0-9.]/.test(line[j])) j++;
      out += '<span class="tok-num">' + esc(line.slice(i, j)) + '</span>';
      i = j;
      continue;
    }
    const OPS3 = ['===', '!==', '<=>'];
    const OPS2 = ['->', '=>', '==', '!=', '<=', '>=', '&&', '||', '??', '++', '--'];
    const three = line.slice(i, i + 3);
    const two = line.slice(i, i + 2);
    if (OPS3.includes(three)){
      out += '<span class="tok-op">' + esc(three) + '</span>';
      i += 3;
      continue;
    }
    if (OPS2.includes(two)){
      out += '<span class="tok-op">' + esc(two) + '</span>';
      i += 2;
      continue;
    }
    if ('.+-*/%=<>!&|?:'.includes(ch)){
      out += '<span class="tok-op">' + esc(ch) + '</span>';
      i++;
      continue;
    }
    out += esc(ch);
    i++;
  }
  return out;
}

function setView(view){
  currentView = view;
  document.querySelectorAll('.topbar nav button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  if (view === 'lessons'){
    renderLessonsRail();

  } else if (view === 'exam'){
    renderExamRail();
    goToExam(currentExamIndex, true);
  } else if (view === 'materials'){
    renderMaterialsRail();
    goToMaterial(currentMatIndex, true);

    renderQuizSetup();
  }
  closeDrawer();
}

function renderLessonsRail(){
  const rail = document.getElementById('rail');
  let html = '';
  html += '<div class="rail-search"><input id="searchInput" placeholder="Поиск по урокам..." value="' + esc(searchQuery) + '"></div>';
  html += '<label class="rail-filter"><input type="checkbox" id="reviewFilter"' + (onlyReview ? ' checked' : '') + '> показывать только «на повторение»</label>';
  html += '<div class="rail-progress" id="progress"></div>';
  COURSE.forEach((b) => {
    html += '<div class="block-group" data-block="' + b.block + '">';
    html += '<div class="block-title">Блок ' + b.block + ' — ' + esc(b.title) + '</div>';
    b.lessons.forEach((l) => {
      const flatIdx = FLAT.findIndex(f => f.lesson.id === l.id);
      const st = lessonState[l.id];
      html += '<button class="lesson-link" data-idx="' + flatIdx + '" data-lid="' + l.id + '" data-search="' + esc((l.id + ' ' + l.title).toLowerCase()) + '">'
            + '<span class="dot' + (st ? ' ' + st : '') + '"></span>'
            + '<span class="num">' + l.id + '</span>'
            + '<span class="label">' + esc(l.title) + '</span>'
            + '</button>';
    });
    html += '</div>';
  });
  html += '<div class="rail-empty" id="railEmpty" style="display:none">Ничего не нашлось</div>';
  rail.innerHTML = html;
  rail.querySelectorAll('.lesson-link').forEach(btn => {
    btn.addEventListener('click', () => goTo(parseInt(btn.dataset.idx, 10)));
  });
  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    applySearch();
  });
  document.getElementById('reviewFilter').addEventListener('change', (e) => {
    onlyReview = e.target.checked;
    applySearch();
  });
  applySearch();
  updateProgress();
}

function applySearch(){
  const q = searchQuery.trim().toLowerCase();
  const rail = document.getElementById('rail');
  let anyVisible = false;
  rail.querySelectorAll('.block-group').forEach(group => {
    let groupHasVisible = false;
    group.querySelectorAll('.lesson-link').forEach(btn => {
      const searchOk = !q || btn.dataset.search.includes(q);
      const reviewOk = !onlyReview || lessonState[btn.dataset.lid] === 'review';
      const match = searchOk && reviewOk;
      btn.classList.toggle('hidden', !match);
      if (match) { groupHasVisible = true; anyVisible = true; }
    });
    group.style.display = groupHasVisible ? '' : 'none';
  });
  document.getElementById('railEmpty').style.display = anyVisible ? 'none' : 'block';
}

function updateProgress(){
  const el = document.getElementById('progress');
  if (!el) return;
  const understood = Object.values(lessonState).filter(s => s === 'understood').length;
  const review = Object.values(lessonState).filter(s => s === 'review').length;
  const pct = Math.round((understood / FLAT.length) * 100);
  el.innerHTML = understood + ' / ' + FLAT.length + ' уроков разобрано'
    + (review ? ' · ' + review + ' на повторении' : '')
    + '<div class="bar"><i style="width:' + pct + '%"></i></div>';
}

function renderContent(){
  const { block, lesson } = FLAT[currentIndex];
  const sheet = document.getElementById('content');
  let html = '';
  html += '<div class="crumb">Блок ' + block.block + ' / Урок ' + lesson.id + '</div>';
  html += '<h2>' + esc(lesson.title) + '</h2>';

  if (currentIndex === 0){
    html += '<div class="intro-note">Прогресс засчитывается только по кнопкам «Понял» ниже, не по факту открытия. Он считается в рамках этой вкладки браузера и не сохраняется после закрытия — фиксируй реальный прогресс в своей системе (Obsidian).</div>';
  }

  if (lesson.code){
    html += '<div class="codebox"><pre>' + highlight(lesson.code) + '</pre></div>';
  }

  html += '<div class="theory-note">';
  lesson.theory.forEach(p => { html += '<p>» ' + esc(p) + '</p>'; });
  html += '</div>';

  if (lesson.tasks){
    html += '<div class="tasks"><h3>Задание</h3>';
    lesson.tasks.forEach((t, ti) => {
      html += '<div class="task lvl' + t.lvl + '"><div class="lvl">Уровень ' + t.lvl + '</div><p>' + esc(t.text) + '</p>';
      if (t.solution){
        html += '<div class="task-foot"><button class="solution-toggle" data-sol="' + ti + '">Показать решение</button>'
              + '<div class="solution-box" id="sol-' + ti + '"><pre style="margin:0;font-family:inherit;white-space:pre-wrap">' + highlight(t.solution) + '</pre></div></div>';
      }
      html += '</div>';
    });
    html += '</div>';
  }

  const st = lessonState[lesson.id];
  html += '<div class="status-row">'
        + '<button class="status-btn understood' + (st === 'understood' ? ' active' : '') + '" id="markUnderstood">Понял ✓</button>'
        + '<button class="status-btn review' + (st === 'review' ? ' active' : '') + '" id="markReview">Нужно повторить</button>'
        + '</div>';

  html += '<div class="navpair">'
        + '<button id="prevBtn"' + (currentIndex === 0 ? ' disabled' : '') + '>&larr; Назад</button>'
        + '<button id="nextBtn"' + (currentIndex === FLAT.length - 1 ? ' disabled' : '') + '>Далее &rarr;</button>'
        + '</div>';

  sheet.innerHTML = html;

  sheet.querySelectorAll('.solution-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const box = document.getElementById('sol-' + btn.dataset.sol);
      const showing = box.classList.toggle('show');
      btn.textContent = showing ? 'Скрыть решение' : 'Показать решение';
    });
  });

  document.getElementById('markUnderstood').addEventListener('click', () => setLessonState(lesson.id, 'understood'));
  document.getElementById('markReview').addEventListener('click', () => setLessonState(lesson.id, 'review'));

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if (prevBtn) prevBtn.addEventListener('click', () => goTo(currentIndex - 1));
  if (nextBtn) nextBtn.addEventListener('click', () => goTo(currentIndex + 1));

  document.querySelector('.main').scrollTo(0,0);
}

function setLessonState(lessonId, status){
  lessonState[lessonId] = (lessonState[lessonId] === status) ? undefined : status;
  if (lessonState[lessonId] === undefined) delete lessonState[lessonId];
  renderContent();
  markActiveInRail();
  updateProgress();
}

function markActiveInRail(){
  document.querySelectorAll('.lesson-link').forEach(btn => {
    const idx = parseInt(btn.dataset.idx, 10);
    btn.classList.toggle('active', idx === currentIndex);
    const dot = btn.querySelector('.dot');
    if (dot){
      dot.classList.remove('understood', 'review');
      const st = lessonState[btn.dataset.lid];
      if (st) dot.classList.add(st);
    }
  });
}

function goTo(idx, skipVisit){
  if (idx < 0 || idx >= FLAT.length) return;
  currentIndex = idx;
  if (!skipVisit) visited.add(idx);
  renderContent();
  markActiveInRail();
  updateProgress();
  closeDrawer();
}

function renderExamRail(){
  const rail = document.getElementById('rail');
  let html = '<div class="block-title" style="padding-top:20px">Демоэкзамен «Корочки.есть»</div>';
  EXAM_GUIDE.forEach((page, idx) => {
    html += '<button class="lesson-link" data-exam="' + idx + '">'
          + '<span class="dot"></span><span class="label">' + esc(page.title) + '</span></button>';

function renderGuideBlocks(blocks){
  return blocks.map(b => {
    if (b.t === 'p') return '<p class="guide-p">' + esc(b.v) + '</p>';
    if (b.t === 'h3') return '<h3 class="guide-h3">' + esc(b.v) + '</h3>';
    if (b.t === 'code') return '<div class="codebox"><pre>' + highlight(b.v) + '</pre></div>';
    if (b.t === 'note') return '<div class="guide-note">' + esc(b.v) + '</div>';
    if (b.t === 'ul') return '<ul class="guide-list">' + b.v.map(li => '<li>' + esc(li) + '</li>').join('') + '</ul>';
    return '';
  }).join('');
}

function goToExam(idx, skip){
  currentExamIndex = idx;
  const page = EXAM_GUIDE[idx];
  const sheet = document.getElementById('content');
  sheet.innerHTML = '<h2>' + esc(page.title) + '</h2>' + renderGuideBlocks(page.blocks)
    + '<div class="navpair">'
    + '<button id="examPrevBtn"' + (idx === 0 ? ' disabled' : '') + '>&larr; Назад</button>'
    + '<button id="examNextBtn"' + (idx === EXAM_GUIDE.length - 1 ? ' disabled' : '') + '>Далее &rarr;</button>'
    + '</div>';
  document.querySelectorAll('#rail .lesson-link').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.exam, 10) === idx);
  });
  const prevBtn = document.getElementById('examPrevBtn');
  const nextBtn = document.getElementById('examNextBtn');
  if (prevBtn) prevBtn.addEventListener('click', () => goToExam(idx - 1));
  if (nextBtn) nextBtn.addEventListener('click', () => goToExam(idx + 1));
  document.querySelector('.main').scrollTo(0,0);
  closeDrawer();
}

function renderMaterialsRail(){
  const rail = document.getElementById('rail');
  let html = '<div class="block-title" style="padding-top:20px">Справочные материалы</div>';
  MATERIALS.forEach((m, idx) => {
    html += '<button class="lesson-link" data-mat="' + idx + '">'
          + '<span class="dot"></span><span class="label">' + esc(m.title) + '</span></button>';
  });

  rail.querySelectorAll('.lesson-link').forEach(btn => {
    btn.addEventListener('click', () => goToMaterial(parseInt(btn.dataset.mat, 10)));

let matSearchQuery = '';

function renderMatCards(items, query){
  const q = query.trim().toLowerCase();
  const filtered = items.filter(it => !q || it.term.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q));
  if (!filtered.length){
    return '<div class="rail-empty">Ничего не нашлось</div>';
  }
  return filtered.map(it =>
    '<div class="ref-card">'
    + '<div class="ref-term">' + esc(it.term) + '</div>'
    + '<div class="ref-desc">' + esc(it.desc) + '</div>'
    + (it.example ? '<div class="codebox ref-example"><pre>' + highlight(it.example) + '</pre></div>' : '')
    + '</div>'
  ).join('');
}

function goToMaterial(idx, skip){
  currentMatIndex = idx;
  matSearchQuery = '';
  const m = MATERIALS[idx];
  const sheet = document.getElementById('content');
  let html = '<h2>' + esc(m.title) + '</h2>';

  if (m.type === 'cards'){
    html += '<div class="mat-search"><input id="matSearchInput" placeholder="Поиск по этому списку..."></div>';
    html += '<div id="matCardsWrap">' + renderMatCards(m.items, '') + '</div>';
  } else if (m.type === 'errors'){
    m.rows.forEach(r => {
      html += '<div class="err-item"><div class="msg">' + esc(r.msg) + '</div><p class="fix">' + esc(r.fix) + '</p></div>';
    });
  } else if (m.type === 'table'){
    html += '<table class="refs"><tr>' + m.cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>';
    m.rows.forEach(row => {
      html += '<tr>' + row.map(cell => '<td>' + esc(cell) + '</td>').join('') + '</tr>';
    });
    html += '</table>';
  } else if (m.type === 'checklist'){
    html += '<ul class="checklist">';
    m.items.forEach(it => { html += '<li>' + esc(it) + '</li>'; });
    html += '</ul>';
  }

  sheet.innerHTML = html;

  if (m.type === 'cards'){
    document.getElementById('matSearchInput').addEventListener('input', (e) => {
      matSearchQuery = e.target.value;
      document.getElementById('matCardsWrap').innerHTML = renderMatCards(m.items, matSearchQuery);
    });
  }

  document.querySelectorAll('#rail .lesson-link').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.mat, 10) === idx);
  });
  document.querySelector('.main').scrollTo(0,0);
  closeDrawer();
}

function openDrawer(){
  document.getElementById('rail').classList.add('open');
  document.getElementById('backdrop').classList.add('show');
}

const QUIZ_SOURCE_LIST = ['PHP', 'SQL', 'Регулярки', 'Git'];

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeOptions(item){
  const pool = QUIZ_ITEMS.filter(i => i.source === item.source && i.answer !== item.answer);
  const distractors = shuffle(pool).slice(0, 3).map(i => i.answer);
  return shuffle([item.answer, ...distractors]);
}

let quizPool = [];
let quizIndex = 0;
let quizScore = { correct: 0, wrong: 0 };
let quizOptions = [];

function renderQuizSetup(){
  const sheet = document.getElementById('content');
  let opts = '<option value="all">Всё вперемешку</option>';
  QUIZ_SOURCE_LIST.forEach(s => { opts += '<option value="' + s + '">' + s + '</option>'; });
  sheet.innerHTML = '<h2>Тренажёр по справочникам</h2>'
    + '<div class="quiz-setup">'
    + '<p style="margin:0 0 4px">По описанию выбираешь правильный вариант из четырёх.</p>'
    + '<select id="quizSource">' + opts + '</select>'
    + '<button class="quiz-start-btn" id="quizStartBtn">Начать</button>'
    + '</div>';
  document.getElementById('quizStartBtn').addEventListener('click', () => {
    const src = document.getElementById('quizSource').value;
    const items = src === 'all' ? QUIZ_ITEMS : QUIZ_ITEMS.filter(i => i.source === src);
    quizPool = shuffle(items);
    quizIndex = 0;
    quizScore = { correct: 0, wrong: 0 };
    renderQuizCard();
  });
}

function renderQuizCard(){
  const sheet = document.getElementById('content');
  if (quizIndex >= quizPool.length){
    const total = quizScore.correct + quizScore.wrong;
    const pct = total ? Math.round((quizScore.correct / total) * 100) : 0;
    sheet.innerHTML = '<h2>Тренажёр по справочникам</h2>'
      + '<div class="quiz-summary">'
      + '<div>Пройдено карточек: ' + total + '</div>'
      + '<div class="score">' + pct + '%</div>'
      + '<div>' + quizScore.correct + ' верно · ' + quizScore.wrong + ' неверно</div>'
      + '<button class="quiz-start-btn" id="quizAgainBtn" style="margin-top:18px">Начать заново</button>'
      + '</div>';
    document.getElementById('quizAgainBtn').addEventListener('click', renderQuizSetup);
    return;
  }
  const item = quizPool[quizIndex];
  quizOptions = makeOptions(item);

  sheet.innerHTML = '<h2>Тренажёр по справочникам</h2>'
    + '<div class="quiz-progress">' + (quizIndex + 1) + ' / ' + quizPool.length + ' · ' + esc(item.source) + '</div>'
    + '<div class="quiz-card">'
    + '<div class="quiz-question">' + esc(item.prompt) + '</div>'
    + '<div class="quiz-options" id="quizOptions">'
    + quizOptions.map((opt, i) => '<button class="quiz-option" data-i="' + i + '"><code>' + esc(opt) + '</code></button>').join('')
    + '</div>'
    + '<div class="quiz-actions" id="quizActions"></div>'
    + '</div>';

  document.querySelectorAll('.quiz-option').forEach(btn => {
    btn.addEventListener('click', () => {
      const picked = quizOptions[parseInt(btn.dataset.i, 10)];
      const ok = picked === item.answer;
      document.querySelectorAll('.quiz-option').forEach(b => {
        b.disabled = true;
        const bOpt = quizOptions[parseInt(b.dataset.i, 10)];
        if (bOpt === item.answer) b.classList.add('correct');
        else if (b === btn) b.classList.add('incorrect');
      });
      if (ok) quizScore.correct++; else quizScore.wrong++;
      document.getElementById('quizActions').innerHTML = '<button class="quiz-start-btn" id="quizNextBtn">Далее →</button>';
      const nextBtn = document.getElementById('quizNextBtn');
      nextBtn.addEventListener('click', () => { quizIndex++; renderQuizCard(); });
      nextBtn.focus();
    });
  });
}
